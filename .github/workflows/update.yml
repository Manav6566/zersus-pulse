name: Zersus Data Harvester

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch: 

# THIS IS THE NEW FIX: It grants the Action permission to save files.
permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install feedparser

      - name: Run dual-engine harvester
        run: python harvester.py

      - name: Commit and Push JSON payloads
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Zersus Automated Daemon"
          
          git add trends.json china_trends.json china_pulse.json
          
          git commit -m "CRON: Daily intelligence streams updated" || echo "No changes to commit"
          git push
